    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f19" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Resource Hints : DNS-Prefetch & Preconnect pour accélérer le chargement et éliminer la latence réseau -->
    <!-- 1. Google Fonts -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- 2. Backend Render API & WebSockets -->
    <link rel="dns-prefetch" href="https://wana-allmand.onrender.com" />
    <link rel="preconnect" href="https://wana-allmand.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://onrender.com" />
    <link rel="preconnect" href="https://onrender.com" crossorigin />

    <!-- 3. Firebase Auth & Services Google Identity -->
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://securetoken.googleapis.com" />
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://wana-allmand.firebaseapp.com" />
    <link rel="preconnect" href="https://wana-allmand.firebaseapp.com" crossorigin />

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800;900&family=Outfit:wght@300;400;600;700;800;900&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
    <title>Wana Allmand - Arène d'Allemand</title>
  </head>

  </body>
